[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v2rayn"
version = "7.0.0"
description = "v2rayN - A V2Ray/Xray/Sing-box GUI client rewritten in Python"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.10"
authors = [
    {name = "2dust"},
]

dependencies = [
    "PySide6>=6.6.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "qrcode[pil]>=7.4",
    "psutil>=5.9.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "aiosqlite>=0.19.0",
    "pynput>=1.7.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
v2rayn = "v2rayn.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
